# CI (task #61). Every step is the command documented in AGENTS.md ->
# Commands, so a red step is reproduced on the host by running that command
# in WSL. No secrets: no test needs an API key.
name: CI

on:
  # A docs-only change that no test reads cannot break CI. Never list a file
  # that tests/ reads: AGENTS.md, README.md, _docs/architecture.md,
  # _docs/deploy-host.md and _docs/testing-guidelines.md.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '_docs/team/**'
      - '_docs/process.md'
      - '_docs/plan.md'
      - '_docs/progress.md'
      - '_docs/task-template.md'
      - '_docs/tasks.md'
      - '_docs/design-system.md'
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '_docs/team/**'
      - '_docs/process.md'
      - '_docs/plan.md'
      - '_docs/progress.md'
      - '_docs/task-template.md'
      - '_docs/tasks.md'
      - '_docs/design-system.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs only the jobs the change needs (scripts/ci_changes.sh). Pushes to
  # master and manual runs always run everything: that is the full safety net.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.c.outputs.python }}
      frontend: ${{ steps.c.outputs.frontend }}
      images: ${{ steps.c.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE...$HEAD" | scripts/ci_changes.sh >> "$GITHUB_OUTPUT"
          else
            printf 'python=true\nfrontend=true\nimages=true\n' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # AGENTS.md -> Setup: tests/adapters/youtube/test_audio.py runs real
      # ffmpeg/ffprobe, and the runner image ships neither. A distro package
      # (not a third-party action) keeps the trusted-action set first-party.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Hash-checking mode covers a whole pip command and refuses editables, so
      # the lock and the editable dev install are two commands (#145).
      - name: Install runtime dependencies from the lock
        run: pip install --require-hashes --no-deps -r requirements.backend.lock
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      # The dev install must not move a locked package (for example
      # typing-extensions or packaging).
      - name: Check the installed set against the lock
        run: |
          pip check
          python scripts/lock_requirements.py --check-installed requirements.backend.lock
      - name: ruff check .
        run: ruff check .
      - name: mypy .
        run: mypy .
      - name: pytest -m "not integration"
        run: pytest -m "not integration"
      # testcontainers starts postgres:18-alpine on the runner's Docker. The
      # `image` tests are excluded here: they run in the `images` job.
      - name: pytest -m "integration and not image"
        run: pytest -m "integration and not image"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: npm ci
        run: npm ci
      - name: npm run --if-present gen:api:check
        run: npm run --if-present gen:api:check
      - name: npm run --if-present lint
        run: npm run --if-present lint
      - name: npm test
        run: npm test
      - name: npm run build
        run: npm run build
      - name: npm audit --audit-level=high
        run: npm audit --audit-level=high

  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Hash-checking mode covers a whole pip command and refuses editables, so
      # the lock and the editable dev install are two commands (#145).
      - name: Install runtime dependencies from the lock
        run: pip install --require-hashes --no-deps -r requirements.backend.lock
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      # The dev install must not move a locked package (for example
      # typing-extensions or packaging).
      - name: Check the installed set against the lock
        run: |
          pip check
          python scripts/lock_requirements.py --check-installed requirements.backend.lock
      # Builds ytdigest-backend:latest before the whisper image (which is
      # FROM that tag), then the frontend image, and runs their runtime checks.
      - name: pytest -m image
        run: pytest -m image

  # Browser-level suite (#177). Gated: it does nothing until web/package.json
  # has a `test:e2e` script, so it needs no workflow change when #177 lands.
  # `npm ci` never downloads a browser (web/.npmrc, PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD).
  e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect the browser suite (#177)
        id: gate
        run: |
          if grep -q '"test:e2e"' package.json; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No test:e2e script in web/package.json yet (#177); skipping."
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - if: steps.gate.outputs.enabled == 'true'
        name: npm ci
        run: npm ci
      - if: steps.gate.outputs.enabled == 'true'
        name: npx playwright install --with-deps chromium
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.enabled == 'true'
        name: npm run test:e2e
        run: npm run test:e2e
