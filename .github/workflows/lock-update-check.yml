# Weekly Python lock staleness report (issue #266, architecture.md 11.3).
#
# Report-only: it goes red with one ::error annotation when regenerating the
# locks with --upgrade would change any entry, and names the entries. It never
# edits a file, opens a PR or gates a deploy, and a PyPI or pip outage ends
# green and retries next week. It also reports direct == pins that are behind
# PyPI (#278): a pin held back on purpose carries `# hold: <reason>` and shows
# as a ::notice instead of turning the run red; yt-dlp is left to its own daily
# check (#68, ytdlp-update-check.yml). A second step (#279) asks OSV.dev whether a locked
# version has a published vulnerability: red with one annotation, and green with a notice
# when OSV is unreachable (retried next week). CI proper lives in ci.yml (#61).
name: Python lock update check

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-update-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Report locks that an --upgrade regeneration would change
        run: python scripts/lock_requirements.py --report-outdated
      - name: Report locked versions with known vulnerabilities (OSV.dev)
        if: ${{ !cancelled() }}
        run: python scripts/lock_requirements.py --report-vulnerabilities
