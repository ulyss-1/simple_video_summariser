# Free-tier LLM providers for SUMMARIZER=free (#364), tried in this order.
# Replace the whole list with FREE_LLM_PROVIDERS_FILE.
#
# Every provider speaks the OpenAI chat-completions protocol.
#   name            label used in logs
#   base_url        https URL; "/chat/completions" is appended
#   model           the provider's model id (free tiers rename these: verify it)
#   context_tokens  context window to plan for; the smallest of the list sizes
#                   the chunks
#   key_setting     which Settings field holds the API key (GROQ_API_KEY,
#                   GEMINI_API_KEY, OPENROUTER_API_KEY, CEREBRAS_API_KEY or
#                   PUTER_AUTH_TOKEN); a provider whose key is unset is skipped
#   protocol        optional: "openai" (default) or "puter" (see below)
# Free tiers are rate-limited and the transcript text goes to the provider.

[[provider]]
name = "groq"
base_url = "https://api.groq.com/openai/v1"
model = "llama-3.3-70b-versatile"
context_tokens = 32768
key_setting = "GROQ_API_KEY"

[[provider]]
name = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.5-flash-lite"
context_tokens = 32768
key_setting = "GEMINI_API_KEY"

[[provider]]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model = "meta-llama/llama-3.3-70b-instruct:free"
context_tokens = 32768
key_setting = "OPENROUTER_API_KEY"

[[provider]]
name = "cerebras"
base_url = "https://api.cerebras.ai/v1"
model = "gpt-oss-120b"
context_tokens = 32768
key_setting = "CEREBRAS_API_KEY"

# Puter: Gemma 4 costs the account nothing, and a new account gets a free monthly
# allowance for the other models. This is the route behind puter.ai.chat() in
# Puter's JavaScript SDK, which Puter does not document: if it changes, this
# provider fails and the list moves on. Last, so it is the fallback of last resort.
# base_url is the full URL for protocol = "puter".
[[provider]]
name = "puter"
base_url = "https://api.puter.com/drivers/call"
model = "gemma-4-26b-a4b-it"
context_tokens = 32768
key_setting = "PUTER_AUTH_TOKEN"
protocol = "puter"
