<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
body { font-family: system-ui, sans-serif; line-height: 1.5; max-width: 48rem; margin: 0 auto; padding: 1rem; color: #1a1a1a; background: #fff; }
h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
h2 { font-size: 1.2rem; margin: 1.5rem 0 0.5rem; border-bottom: 1px solid #ccc; }
.meta { color: #555; margin: 0 0 1rem; }
.tldr { white-space: pre-line; margin: 0; }
.empty { color: #555; font-style: italic; margin: 0; }
ul { padding-left: 1.25rem; margin: 0; }
li { margin: 0 0 0.5rem; }
.sub { margin: 0.1rem 0 0; }
.who, .confidence { color: #555; font-size: 0.9rem; }
footer { margin-top: 2rem; color: #555; font-size: 0.85rem; border-top: 1px solid #ccc; padding-top: 0.5rem; }
a { color: #0b57d0; }
@media print { a { color: inherit; text-decoration: none; } }
</style>
</head>
<body>
<header>
<h1>$title</h1>
<p class="meta">$meta</p>
</header>
<main>
<section>
<h2>TL;DR</h2>
$tldr_block
</section>
$speakers_section
<section>
<h2>Topics</h2>
$topics_block
</section>
<section>
<h2>Claims</h2>
$claims_block
</section>
<section>
<h2>Quotes</h2>
$quotes_block
</section>
</main>
<footer>
$footer
</footer>
</body>
</html>
