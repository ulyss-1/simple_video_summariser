[alembic]
# Hand-written SQL migrations only (architecture.md 6); target_metadata is
# None in migrations/env.py, autogenerate is never used. The database URL
# comes from common.config.get_settings().DATABASE_URL — this file carries
# no database URL or credentials (task #7).
script_location = migrations

# Sequential ids (0001_baseline.py, 0002_..., ...) so revision order is
# visible at a glance without opening each file. New revisions are created
# with an explicit --rev-id, e.g.:
#   alembic revision --rev-id 0002 -m "add channels and videos"
file_template = %%(rev)s_%%(slug)s

# No [loggers] / [handlers] / [formatters] here (task #71): nothing reads
# them. migrations/env.py routes this process's logging through
# common.logging.configure_logging(get_settings()) instead, the same way
# every other service does (architecture.md 10, 12).
